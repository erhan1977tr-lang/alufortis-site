name: Derle ve test et

# PR'larda ve main'de: yalnızca derleme + Playwright testleri.
# Bu iş akışı artık sunucuya HİÇBİR ŞEY yüklemez. main'deki Next.js sitesi
# canlı sürüm değildir; 2026-11-10'da main'e yapılan push'lar bu adımla
# alufortis.gkh.ro ana sayfasının üzerine eski siteyi yüklemişti.
# Canlı site yayin/ klasörlerinden, ayrı ve onaylı iş akışlarıyla yüklenir.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Derle ve test et
    runs-on: ubuntu-latest
    concurrency:
      group: alufortis-ci-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Derle (out/ klasörü + denetim)
        run: npm run build
      - name: Playwright tarayıcısını kur
        run: npx playwright install --with-deps chromium
      - name: Playwright testleri (masaüstü ve mobil)
        run: npx playwright test
      - name: Test raporunu sakla
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
