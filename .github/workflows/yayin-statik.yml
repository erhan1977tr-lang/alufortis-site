name: Statik siteyi yedekle ve alufortis.gkh.ro'ya yayınla

# yayin/alufortis-gkh klasöründeki statik site GreenGeeks'e gider. 2026-11-11 sürümü: eski /v2 (görsel bölümlü)
# sürüm, müşteri düzeltmeleri (alufortis_duzeltme1) ve açılış filmi v5 ile ana adrese taşınır; teklif formu
# dosya ekleriyle teklif.php üzerinden e-posta gönderir. /v2 adresi ana siteye 301 ile yönlendirilir.
# Yayın yalnızca Erhan'ın açık onayıyla yapılır.
# 2026-11-11: yönetim paneli (/yonetim). Sayfalar şablon + içerikten üretilir; panelde yapılan yazı değişiklikleri
# (sunucudaki _yonetim-veri/icerik.json), ek sınırı, SMTP ayarları ve panel şifresi yayında korunur, üzerine yazılmaz.
# Önce canlı dosyaların tamamı sunucudaki erişime kapalı _yedek klasörüne kopyalanır.
# Üç dil (TR, EN, DE) birlikte yüklenir. Hiçbir dosya silinmez. FTPS: TLS zorunlu, sertifika ve ana makine adı doğrulanır.
on:
  push:
    branches: [claude/project-thread-3xxexf]
    paths:
      - "yayin/alufortis-gkh/**"
      - ".github/workflows/yayin-statik.yml"

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: greengeeks
      url: https://alufortis.gkh.ro
    concurrency:
      group: greengeeks-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Dosyaları ve secret'ları denetle
        env:
          GG_FTP_SERVER: ${{ secrets.GG_FTP_SERVER }}
          GG_FTP_USERNAME: ${{ secrets.GG_FTP_USERNAME }}
          GG_FTP_PASSWORD: ${{ secrets.GG_FTP_PASSWORD }}
        run: |
          cd yayin/alufortis-gkh
          test -f index.html && test -f en/index.html && test -f de/index.html && test -f .htaccess && test -f .user.ini && test -f teklif.php && test -f assets/hero-scrub-v5.mp4 && test -f assets/gorsel/tesis.webp
          grep -q "assets/hero-scrub-v5.mp4" index.html && grep -q "../assets/hero-scrub-v5.mp4" en/index.html && grep -q "../assets/hero-scrub-v5.mp4" de/index.html
          if grep -q noindex index.html en/index.html de/index.html; then echo "::error::ana sitede noindex kalmış"; exit 1; fi
          php -l teklif.php
          for f in yonetim/*.php; do php -l "$f"; done
          test -f _yonetim-veri/sablon-tr.html && test -f _yonetim-veri/icerik-varsayilan.json && test -f _yonetim-veri/.htaccess
          for v in GG_FTP_SERVER GG_FTP_USERNAME GG_FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v secret'ı tanımlı değil"; exit 1; fi
          done
          find . -type f -printf '%s %p\n' | sort -k2

      - name: lftp kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Canlı dosyaları yedekle (sunucuda, web'den erişime kapalı)
        env:
          GG_FTP_SERVER: ${{ secrets.GG_FTP_SERVER }}
          GG_FTP_USERNAME: ${{ secrets.GG_FTP_USERNAME }}
          GG_FTP_PASSWORD: ${{ secrets.GG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          TAG=$(date -u +%Y-%m-%d-%H%M)-onceki
          echo "YEDEK=_yedek/$TAG" >> "$GITHUB_ENV"
          mkdir -p canli
          cat > tls.lftp <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate true
          set ssl:check-hostname true
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 30
          EOF
          printf 'Require all denied\n<IfModule !mod_authz_core.c>\nDeny from all\n</IfModule>\n' > deny.htaccess
          lftp -u "$GG_FTP_USERNAME","$GG_FTP_PASSWORD" "ftp://$GG_FTP_SERVER" -e "
            source tls.lftp;
            mirror --verbose=1 --exclude-glob _yedek/ --exclude-glob .well-known/ --exclude-glob cgi-bin/ / canli;
            bye"
          echo "--- canlıdaki dosyalar (yedeklenen) ---"
          (cd canli && find . -type f -printf '%s %p\n' | sort -k2)
          test -f canli/index.html
          lftp -u "$GG_FTP_USERNAME","$GG_FTP_PASSWORD" "ftp://$GG_FTP_SERVER" -e "
            source tls.lftp;
            mkdir -p -f /_yedek;
            put deny.htaccess -o /_yedek/.htaccess;
            mirror -R --no-perms --verbose=1 canli /_yedek/$TAG;
            bye"
          echo "Yedek: /_yedek/$TAG"

      - name: Sayfaları sunucudaki panel içeriğiyle üret
        env:
          YONETIM_SIFRE: ${{ secrets.YONETIM_SIFRE }}
        run: |
          set -euo pipefail
          cd yayin/alufortis-gkh
          # yönetim panelinde yapılan yazı değişiklikleri, ek sınırı, kapalı bölümler ve yüklü kataloglar sunucuda kalır; sayfalar onlarla üretilir (/katalog klasörüne dokunulmaz)
          for f in icerik.json site-ayar.json katalog.json; do
            if [ -f "../../canli/_yonetim-veri/$f" ]; then cp "../../canli/_yonetim-veri/$f" "_yonetim-veri/$f"; echo "sunucudaki $f kullanılıyor"; fi
          done
          php yonetim/lib.php uret
          php yonetim/lib.php ini
          grep -q "assets/hero-scrub-v5.mp4" index.html
          if ! grep -q "{{" index.html en/index.html de/index.html; then echo "yer tutucu kalmadı"; else echo "::error::doldurulmamış yer tutucu"; exit 1; fi
          # panel şifresi: sunucuda yoksa ve secret tanımlıysa bir kez oluşturulur, varsa asla değiştirilmez
          echo "SIFRE_YUKLE=0" >> "$GITHUB_ENV"
          if [ ! -f ../../canli/_yonetim-veri/sifre.php ]; then
            if [ -n "$YONETIM_SIFRE" ]; then php yonetim/lib.php sifre && echo "SIFRE_YUKLE=1" >> "$GITHUB_ENV"; else echo "::warning::Panel şifresi tanımlı değil (YONETIM_SIFRE secret'ı yok); panel girişi kapalı kalır"; fi
          fi

      - name: Yeni siteyi yükle (önce varlıklar, en son index.html)
        env:
          GG_FTP_SERVER: ${{ secrets.GG_FTP_SERVER }}
          GG_FTP_USERNAME: ${{ secrets.GG_FTP_USERNAME }}
          GG_FTP_PASSWORD: ${{ secrets.GG_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s\n' '# Eski ikinci surum artik ana adreste: kalici yonlendirme' 'RewriteEngine On' 'RewriteRule ^en(/.*)?$ /en/ [R=301,L]' 'RewriteRule ^de(/.*)?$ /de/ [R=301,L]' 'RewriteRule ^ / [R=301,L]' > v2.htaccess
          cd yayin/alufortis-gkh
          SIFRE_KOMUT=""
          if [ "$SIFRE_YUKLE" = 1 ]; then SIFRE_KOMUT="put _yonetim-veri/sifre.php -o /_yonetim-veri/sifre.php;"; fi
          lftp -u "$GG_FTP_USERNAME","$GG_FTP_PASSWORD" "ftp://$GG_FTP_SERVER" -e "
            source ../../tls.lftp;
            mirror -R --no-perms --verbose=1 assets /assets;
            mirror -R --no-perms --verbose=1 en /en;
            mirror -R --no-perms --verbose=1 de /de;
            put .user.ini -o /.user.ini;
            put teklif.php -o /teklif.php;
            mirror -R --no-perms --verbose=1 yonetim /yonetim;
            mkdir -p -f /_yonetim-veri;
            put _yonetim-veri/.htaccess -o /_yonetim-veri/.htaccess;
            put _yonetim-veri/sablon-tr.html -o /_yonetim-veri/sablon-tr.html;
            put _yonetim-veri/sablon-en.html -o /_yonetim-veri/sablon-en.html;
            put _yonetim-veri/sablon-de.html -o /_yonetim-veri/sablon-de.html;
            put _yonetim-veri/icerik-varsayilan.json -o /_yonetim-veri/icerik-varsayilan.json;
            $SIFRE_KOMUT
            put .htaccess -o /.htaccess;
            put index.html -o /index.html;
            mkdir -p -f /v2;
            put ../../v2.htaccess -o /v2/.htaccess;
            cls -l /assets/hero-scrub-v5.mp4 /teklif.php /index.html /v2/.htaccess;
            bye"

      - name: Canlıyı doğrula
        run: |
          set -u
          ok=1
          for i in 1 2 3; do
            curl -fsS --max-time 30 https://alufortis.gkh.ro/ -o canli.html && break; sleep 5
          done
          grep -q "assets/hero-scrub-v5.mp4" canli.html && echo "index.html yeni sürüm" || { echo "::error::index.html eski görünüyor"; ok=0; }
          for l in en de; do
            curl -fsS --max-time 30 "https://alufortis.gkh.ro/$l/" | grep -q "<html lang=\"$l\">" && echo "$l/ yayında" || { echo "::error::$l/ açılmadı"; ok=0; }
          done
          for p in assets/hero-scrub-v5.mp4 assets/gorsel/tesis.webp assets/vendor/gsap.min.js assets/vendor/ScrollTrigger.min.js assets/vendor/three/three.module.min.js assets/logo-dark.svg assets/profile-7800-1.json assets/land-110m.json; do
            want=$(stat -c %s "yayin/alufortis-gkh/$p")
            got=$(curl -fsSI --max-time 30 "https://alufortis.gkh.ro/$p" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
            code=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 30 "https://alufortis.gkh.ro/$p")
            echo "$p http=$code boyut=$got beklenen=$want"
            [ "$code" = "200" ] || ok=0
          done
          for u in yonetim/:200 _yonetim-veri/sablon-tr.html:403 _yonetim-veri/icerik-varsayilan.json:403 yonetim/lib.php:403 yonetim/PHPMailer/SMTP.php:403; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://alufortis.gkh.ro/${u%%:*}")
            echo "${u%%:*}: http=$code (${u##*:} beklenir)"; [ "$code" = "${u##*:}" ] || ok=0
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://alufortis.gkh.ro/teklif.php")
          echo "teklif.php GET: http=$code (405 beklenir)"; [ "$code" = "405" ] || ok=0
          for v in v2/ v2/en/ v2/de/; do
            loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 "https://alufortis.gkh.ro/$v")
            echo "$v -> $loc"; case "$loc" in 301*) ;; *) ok=0 ;; esac
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://alufortis.gkh.ro/$YEDEK/index.html")
          echo "yedek klasörü web'den: http=$code (403 beklenir)"
          [ "$ok" = 1 ]
